name: Native Magento financial acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the tested merchant ZIP to its existing version tag after all checks pass'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb@sha256:31c1aa20ba2d78c4cbc45b2675e40ffd6a3cd59897a9767ce88fc284309f55ab
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: lunixi_magento
          MARIADB_USER: lunixi_ci
          MARIADB_PASSWORD: isolated-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MAGENTO_ROOT: ${{ github.workspace }}/.cache/magento-2.4.9
      LUNIXI_NATIVE_TEST_DESTRUCTIVE: '1'
      LUNIXI_TEST_DB_CONFIG: ${{ github.workspace }}/.cache/test-db.json
      LUNIXI_TEST_MODULE_PATH: ${{ github.workspace }}/build/module
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.5'
          extensions: bcmath,ctype,curl,dom,ftp,gd,hash,iconv,intl,mbstring,openssl,pdo_mysql,simplexml,soap,sodium,xsl,zip
          tools: composer:2.11.1
          coverage: none
      - name: Locked tooling and standalone merchant module
        run: |
          python3 tools/test-release-metadata.py
          python3 tools/test-native-security-aliases.py
          composer install --working-dir=tools --no-interaction --no-plugins --no-scripts --prefer-dist
          php tools/build.php
      - name: Private disposable native database configuration
        run: |
          mkdir -p .cache
          php -r '$p=getenv("LUNIXI_TEST_DB_CONFIG");file_put_contents($p,json_encode(["host"=>"127.0.0.1","port"=>3306,"database"=>"lunixi_magento","username"=>"lunixi_ci","password"=>"isolated-ci-only"]));chmod($p,0600);'
      - name: Checksum-pinned native install and DI compile
        run: php tools/native-bootstrap.php "$MAGENTO_ROOT"
      - name: Real native orders, invoices, refunds, rollback and concurrent replay
        run: php -d memory_limit=1G tools/vendor/bin/phpunit --testdox
      - name: Static analysis, formatting, script and dependency checks
        run: |
          node --test tests/checkout.test.cjs
          tools/vendor/bin/phpstan analyse --memory-limit=1G --no-progress
          tools/vendor/bin/phpcs --standard=phpcs.xml
          find Model Gateway Controller Block Plugin tools -path 'tools/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          find view -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile tools/native-security.py tools/test-release-metadata.py tools/test-native-security-aliases.py
          composer audit --working-dir=tools
          composer audit --working-dir=build/input --no-dev
      - name: Pinned source and standalone artifact secret scans
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output .cache/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .cache/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .cache/gitleaks.tar.gz -C .cache gitleaks
          .cache/gitleaks dir . --config .gitleaks.toml --redact --no-banner
          printf '[extend]\nuseDefault = true\n' > .cache/default-gitleaks.toml
          .cache/gitleaks dir build/module --config .cache/default-gitleaks.toml --redact --no-banner
      - name: Prepare only the exact tested ZIP and its checksum
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          metadata = Path('VERSION')
          version = json.loads(metadata.read_text())["version"] if metadata.suffix == ".json" else metadata.read_text().strip()
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("A trusted semantic release version is required.")
          import hashlib, shutil, zipfile
          name = 'lunixi-magento2-{version}.zip'.format(version=version)
          source = Path('dist') / name
          if source.is_symlink() or not source.is_file() or not 0 < source.stat().st_size <= 256 * 1024 * 1024:
              raise SystemExit("The exact tested merchant ZIP is missing or invalid.")
          with zipfile.ZipFile(source) as archive:
              if len(archive.infolist()) > 20000 or sum(item.file_size for item in archive.infolist()) > 1024 * 1024 * 1024:
                  raise SystemExit("Merchant archive exceeds the release bound.")
              if archive.testzip() is not None:
                  raise SystemExit("Merchant archive CRC verification failed.")
          output = Path("release-assets")
          output.mkdir()
          shutil.copyfile(source, output / name)
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          (output / "SHA256SUMS").write_text(digest + "  " + name + "\n", encoding="ascii")
          PY
      - name: Store tested native release assets
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-native-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish_release:
    name: Publish the tested merchant ZIP to an existing tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: native-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-native-release
          path: release-assets
      - name: Validate passive assets against trusted source metadata
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          metadata = Path('VERSION')
          version = json.loads(metadata.read_text())["version"] if metadata.suffix == ".json" else metadata.read_text().strip()
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("A trusted semantic release version is required.")
          import hashlib, os, zipfile
          name = 'lunixi-magento2-{version}.zip'.format(version=version)
          folder = Path("release-assets")
          if folder.is_symlink() or {path.name for path in folder.iterdir()} != {name, "SHA256SUMS"}:
              raise SystemExit("Release accepts only the expected ZIP and SHA256SUMS.")
          asset, checksum = folder / name, folder / "SHA256SUMS"
          if asset.is_symlink() or checksum.is_symlink() or not asset.is_file() or not checksum.is_file():
              raise SystemExit("Release assets must be regular files.")
          if not 0 < asset.stat().st_size <= 256 * 1024 * 1024 or checksum.stat().st_size > 1024:
              raise SystemExit("Release assets exceed their configured bound.")
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          if checksum.read_text(encoding="ascii") != digest + "  " + name + "\n":
              raise SystemExit("The tested ZIP checksum does not match.")
          with zipfile.ZipFile(asset) as archive:
              if len(archive.infolist()) > 20000 or sum(item.file_size for item in archive.infolist()) > 1024 * 1024 * 1024 or archive.testzip() is not None:
                  raise SystemExit("Invalid merchant ZIP; artifact contents are never executed.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("version=" + version + "\nzip_name=" + name + "\n")
          notes = "Merchant installation ZIP and SHA256SUMS from the fully passing workflow run.\n\n"
          notes += "Source commit: " + os.environ["GITHUB_SHA"] + "\n"
          notes += "Verification: " + os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"] + "\n\n"
          notes += "Verify SHA256SUMS before installation; follow the repository README and staging/backup instructions. This release does not imply marketplace certification or a live merchant charge.\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Create the release without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
          RELEASE_ZIP: ${{ steps.verify.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          python3 - <<'PY_GATE'
          import json, os, re, subprocess
          repo, version, source = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_VERSION'], os.environ['GITHUB_SHA']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version) or not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('Invalid trusted release identity.')
          def api(path):
              result = subprocess.run(['gh', 'api', 'repos/' + repo + '/' + path], check=True, capture_output=True, text=True)
              return json.loads(result.stdout)
          obj = api('git/ref/tags/v' + version)['object']
          for _ in range(4):
              if not re.fullmatch(r'[0-9a-f]{40}', obj['sha']):
                  raise SystemExit('Invalid release tag object.')
              if obj['type'] == 'commit':
                  break
              if obj['type'] != 'tag':
                  raise SystemExit('Release tag does not identify a commit.')
              obj = api('git/tags/' + obj['sha'])['object']
          if obj['type'] != 'commit' or obj['sha'] != source:
              raise SystemExit('Version tag differs from the tested source commit; refusing publication.')
          print('Existing version tag identifies the exact tested source commit.')
          PY_GATE
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$tag" "release-assets/$RELEASE_ZIP" release-assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lunixi Magento $RELEASE_VERSION" --notes-file release-notes.md
