name: Native Magento financial acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb@sha256:31c1aa20ba2d78c4cbc45b2675e40ffd6a3cd59897a9767ce88fc284309f55ab
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: lunixi_magento
          MARIADB_USER: lunixi_ci
          MARIADB_PASSWORD: isolated-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MAGENTO_ROOT: ${{ github.workspace }}/.cache/magento-2.4.9
      LUNIXI_NATIVE_TEST_DESTRUCTIVE: '1'
      LUNIXI_TEST_DB_CONFIG: ${{ github.workspace }}/.cache/test-db.json
      LUNIXI_TEST_MODULE_PATH: ${{ github.workspace }}/build/module
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.5'
          extensions: bcmath,ctype,curl,dom,ftp,gd,hash,iconv,intl,mbstring,openssl,pdo_mysql,simplexml,soap,sodium,xsl,zip
          tools: composer:2.11.1
          coverage: none
      - name: Locked tooling and standalone merchant module
        run: |
          composer install --working-dir=tools --no-interaction --no-plugins --no-scripts --prefer-dist
          php tools/build.php
      - name: Private disposable native database configuration
        run: |
          mkdir -p .cache
          php -r '$p=getenv("LUNIXI_TEST_DB_CONFIG");file_put_contents($p,json_encode(["host"=>"127.0.0.1","port"=>3306,"database"=>"lunixi_magento","username"=>"lunixi_ci","password"=>"isolated-ci-only"]));chmod($p,0600);'
      - name: Checksum-pinned native install and DI compile
        run: php tools/native-bootstrap.php "$MAGENTO_ROOT"
      - name: Real native orders, invoices, refunds, rollback and concurrent replay
        run: php -d memory_limit=1G tools/vendor/bin/phpunit --testdox
      - name: Static analysis, formatting, script and dependency checks
        run: |
          node --test tests/checkout.test.cjs
          tools/vendor/bin/phpstan analyse --memory-limit=1G --no-progress
          tools/vendor/bin/phpcs --standard=phpcs.xml
          find Model Gateway Controller Block Plugin tools -path 'tools/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          find view -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile tools/native-security.py
          composer audit --working-dir=tools
          composer audit --working-dir=build/input --no-dev
      - name: Pinned source and standalone artifact secret scans
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output .cache/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .cache/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .cache/gitleaks.tar.gz -C .cache gitleaks
          .cache/gitleaks dir . --config .gitleaks.toml --redact --no-banner
          printf '[extend]\nuseDefault = true\n' > .cache/default-gitleaks.toml
          .cache/gitleaks dir build/module --config .cache/default-gitleaks.toml --redact --no-banner
